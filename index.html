<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>犯人は踊る ONLINE</title><link rel="stylesheet" href="./style.css?v=0.2.0"></head>
<body>
<div id="app">
<header class="top"><span></span><h1>犯人は踊る ONLINE</h1><span class="ver">v0.2.0</span></header>
<main class="page">
<div class="name-row"><input class="input" maxlength="32" placeholder="プレイヤー名"><button class="btn">更新</button></div>
<div class="rooms">
<article class="panel room"><h2>ROOM 1</h2><div class="muted">接続確認中…</div></article>
<article class="panel room"><h2>ROOM 2</h2><div class="muted">接続確認中…</div></article>
<article class="panel room"><h2>ROOM 3</h2><div class="muted">接続確認中…</div></article>
<article class="panel room"><h2>ROOM 4</h2><div class="muted">接続確認中…</div></article>
</div></main></div><div id="toast"></div>
<script>const APP_VERSION='v0.2.0';
const GAME_ID='dancing-criminal';
const GAME_NAME='犯人は踊る';
const MAX_PLAYERS=8;
const COMMON_PLAYER_NAME_KEY='boardgamePlayerName';
const NAME_DRAFT_KEY='dancingCriminalNameDraft';
const DEFAULT_SERVER='https://dancing-criminal-online.naitoryo7110.workers.dev';
function safeGet(storage,key){try{return storage.getItem(key)}catch{return null}}
function safeSet(storage,key,value){try{storage.setItem(key,value)}catch{}}
function safeRemove(storage,key){try{storage.removeItem(key)}catch{}}
const SERVER_URL=safeGet(localStorage,'dancingCriminalServer')||DEFAULT_SERVER;
const $=s=>document.querySelector(s), app=$('#app');
let me={room:'',token:'',name:'',state:null,selected:null}, pollTimer=null, modalKey='';
const CARD_DESC={
 first:'ゲーム開始時に公開されます',criminal:'最後の1枚なら出して逃走成功',detective:'プレイヤーを指名して犯人を当てます',alibi:'犯人と同時に持つ間は犯人扱いされません',conspiracy:'以後、犯人陣営になります',dog:'他人の手札1枚を公開し、犯人なら勝利',boy:'現在の犯人を自分だけ確認',witness:'他人1人の手札を自分だけ確認',trade:'相手と1枚ずつ秘密交換',info:'全員が左隣へ1枚渡します',rumor:'全員が右隣の裏向き手札から1枚選びます',civilian:'効果なし'};
const CARD_NAME={first:'第一発見者',criminal:'犯人',detective:'探偵',alibi:'アリバイ',conspiracy:'たくらみ',dog:'いぬ',boy:'少年',witness:'目撃者',trade:'取り引き',info:'情報操作',rumor:'うわさ',civilian:'一般人'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function api(path,opt={}){let r=await fetch(SERVER_URL+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'通信エラー');return j}
function top(){return `<header class="top"><span></span><h1>犯人は踊る ONLINE</h1><span class="ver">${APP_VERSION}</span></header>`}
function savedName(){return (safeGet(sessionStorage,NAME_DRAFT_KEY)||safeGet(localStorage,COMMON_PLAYER_NAME_KEY)||'').trim().slice(0,32)}
async function title(){stopPoll();me.state=null;app.innerHTML=top()+`<main class="page"><div class="name-row"><input id="name" class="input" maxlength="32" placeholder="プレイヤー名" value="${esc(savedName())}"><button class="btn" id="reload">更新</button></div><div id="rooms" class="rooms"></div></main>`;$('#name').oninput=e=>safeSet(sessionStorage,NAME_DRAFT_KEY,e.target.value);$('#reload').onclick=loadRooms;await loadRooms();pollTimer=setInterval(loadRooms,3000)}
async function loadRooms(){try{let d=await api('/api/rooms');$('#rooms').innerHTML=d.rooms.map((r,i)=>`<article class="panel room"><div style="display:flex;justify-content:space-between"><h2>ROOM ${i+1}</h2><span class="muted">${r.status==='playing'?'ゲーム中':r.status==='finished'?'終了':'待機中'}</span></div><b>${r.humans}/${MAX_PLAYERS}人</b><div class="players-mini">${r.names.length?'参加者：'+r.names.map(esc).join(' / '):'参加者：なし'}</div><button class="btn" onclick="joinRoom('${r.id}')">${r.names.includes(savedName())?'再接続':'参加する'}</button><button class="btn danger" onclick="resetRoom('${r.id}')">初期化</button></article>`).join('')}catch(e){$('#rooms').innerHTML=`<div class="panel" style="grid-column:1/-1">サーバーへ接続できません。Workerを先にデプロイしてください。<br><span class="muted">${esc(e.message)}</span></div>`}}
async function joinRoom(room){let name=$('#name').value.trim();if(!name)return toast('名前を入力してください');try{let old=JSON.parse(safeGet(localStorage,'dancingCriminalSession')||'{}');let d=await api(`/api/room/${room}/join`,{method:'POST',body:JSON.stringify({name,token:old.room===room&&old.name===name?old.token:''})});me={room,name,token:d.token,state:null,selected:null};safeSet(localStorage,'dancingCriminalSession',JSON.stringify({room,name,token:d.token}));startPoll()}catch(e){toast(e.message)}}
async function resetRoom(room){let name=$('#name').value.trim();if(!name)return toast('名前を入力してください');if(!confirm(`${room.toUpperCase()}を初期化しますか？`))return;try{await api(`/api/room/${room}/reset`,{method:'POST',body:JSON.stringify({name})});toast('初期化しました');loadRooms()}catch(e){toast(e.message)}}
function stopPoll(){if(pollTimer)clearInterval(pollTimer);pollTimer=null}
function startPoll(){stopPoll();refresh();pollTimer=setInterval(refresh,1000)}
async function refresh(){if(!me.room)return;try{let d=await api(`/api/room/${me.room}/state?token=${encodeURIComponent(me.token)}`);me.state=d;render()}catch(e){if(e.message.includes('参加')){toast(e.message);title()}}}
function render(){let s=me.state;if(!s)return;if(s.status==='lobby')renderLobby();else renderGame()}
function renderLobby(){let s=me.state;app.innerHTML=top()+`<main class="page"><div class="lobby-grid"><section class="panel"><h2>${s.roomLabel} ロビー</h2>${s.players.map(p=>`<div class="player-row"><span>${p.host?'👑 ':''}${esc(p.name)}${p.cpu?' 🤖':''}</span><span>${p.cpu&&s.isHost?`<button class="btn danger" onclick="act('removeCpu',{id:'${p.id}'})">削除</button>`:''}</span></div>`).join('')}<div class="actions">${s.isHost?`<button class="btn secondary" onclick="act('addCpu')" ${s.players.length>=8?'disabled':''}>CPU追加</button><button class="btn good" onclick="act('start')" ${s.players.length<3?'disabled':''}>ゲーム開始</button>`:''}<button class="btn secondary" onclick="leaveRoom()">退出</button></div><p class="muted">3～8人。CPUを含め3人以上で開始できます。</p></section><section class="panel settings"><h2>ゲーム設定</h2><label>デッキ</label><select id="deck" ${s.isHost?'':'disabled'}><option value="standard" ${s.settings.deck==='standard'?'selected':''}>標準</option><option value="random" ${s.settings.deck==='random'?'selected':''}>ランダム</option><option value="custom" ${s.settings.deck==='custom'?'selected':''}>カスタム</option></select><div id="customDeck" style="display:${s.settings.deck==='custom'?'grid':'none'};grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">${Object.keys(CARD_NAME).map(t=>`<label style="display:flex;justify-content:space-between;gap:8px"><span>${CARD_NAME[t]}</span><input data-custom="${t}" type="number" min="0" max="${({first:1,criminal:1,detective:4,alibi:5,conspiracy:2,dog:1,boy:1,witness:3,trade:5,info:3,rumor:4,civilian:2})[t]}" value="${s.settings.custom?.[t]??0}" style="width:64px;padding:5px"></label>`).join('')}</div><label>事件名（任意）</label><input id="incident" maxlength="40" value="${esc(s.settings.incident||'')}" ${s.isHost?'':'disabled'} placeholder="例：冷蔵庫のプリンが消えた">${s.isHost?`<button class="btn" style="margin-top:12px" onclick="saveSettings()">設定保存</button>`:''}<p class="muted">カスタムは開始人数×4枚になるよう設定します。第一発見者・犯人は各1枚必須です。</p></section></div></main>`;let deckEl=$('#deck');if(deckEl&&!deckEl.disabled)deckEl.onchange=()=>{let c=$('#customDeck');if(c)c.style.display=deckEl.value==='custom'?'grid':'none'}}
async function saveSettings(){let custom={};document.querySelectorAll('[data-custom]').forEach(x=>custom[x.dataset.custom]=Number(x.value)||0);await act('settings',{deck:$('#deck').value,incident:$('#incident').value,custom})}
async function leaveRoom(){try{await act('leave')}finally{me.room='';safeRemove(localStorage,'dancingCriminalSession');title()}}
async function act(action,data={}){try{await api(`/api/room/${me.room}/action`,{method:'POST',body:JSON.stringify({token:me.token,action,data})});await refresh()}catch(e){toast(e.message)}}
function cardHtml(c,click=true){let cls=c.type==='criminal'?'criminal':c.type==='detective'?'detective':c.type==='alibi'?'alibi':c.type==='conspiracy'?'conspiracy':'';return `<div class="card ${cls} ${me.selected===c.id?'selected':''}" ${click?`onclick="selectCard('${c.id}')"`:''}><b>${CARD_NAME[c.type]}</b><small>${CARD_DESC[c.type]}</small></div>`}
function renderGame(){let s=me.state;safeSet(localStorage,COMMON_PLAYER_NAME_KEY,me.name);let mine=s.players.find(p=>p.me);let turn=s.players[s.turnIndex];app.innerHTML=top()+`<main class="game"><section class="table"><div class="opponents">${s.players.map(p=>`<div class="pbox ${p.id===turn?.id?'turn':''} ${s.pending?.readyIds?.includes(p.id)?'ready':''}"><div class="pname">${p.host?'👑 ':''}${esc(p.name)}${p.cpu?' 🤖':''}${p.me?'（あなた）':''}</div><div>手札 ${p.handCount}枚 ${p.conspirator?'・たくらみ':''}</div></div>`).join('')}</div><div class="center"><div class="muted">${esc(s.incident||'事件が発生しました！')}</div><div class="bigmsg">${s.status==='finished'?'事件終了':turn?`${esc(turn.name)}の手番`:''}</div><div class="discard">${s.discard?.length?cardHtml(s.discard[s.discard.length-1],false):'<span class="muted">公開カードなし</span>'}</div><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="showHistory()">履歴</button>${s.status==='finished'?`<button class="btn" onclick="showResult()">リザルト</button>`:''}</div></div></section><section class="handarea"><div class="handtop"><b>あなたの手札 ${mine?.hand?.length||0}枚</b><span>${s.pending?.message?esc(s.pending.message):''}</span></div><div class="hand">${(mine?.hand||[]).map(c=>cardHtml(c,true)).join('')||'<span class="muted">手札がありません</span>'}</div></section></main>`;handlePending()}
function selectCard(id){let s=me.state,m=s.players.find(p=>p.me);if(s.status!=='playing')return;if(s.pending&&s.pending.type!=='choosePass'&&s.pending.type!=='tradeRespond')return;if(s.pending?.type==='choosePass'){return act('pendingChoice',{cardId:id})}if(s.pending?.type==='tradeRespond'){return act('pendingChoice',{cardId:id})}if(s.players[s.turnIndex]?.id!==m.id)return toast('あなたの手番ではありません');me.selected=id;let c=m.hand.find(x=>x.id===id);openCardConfirm(c)}
function openCardConfirm(c){modalKey='card';showModal(`<h2>${CARD_NAME[c.type]}</h2>${cardHtml(c,false)}<p>${CARD_DESC[c.type]}</p><div class="actions"><button class="btn" onclick="playSelected()">このカードを出す</button><button class="btn secondary" onclick="closeModal()">戻る</button></div>`)}
function playSelected(){let id=me.selected;closeModal();me.selected=null;act('play',{cardId:id})}
function showModal(html){let old=$('.modal-bg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg"><div class="modal">${html}</div></div>`)}
function closeModal(){let m=$('.modal-bg');if(m)m.remove();modalKey=''}
function handlePending(){let p=me.state.pending;if(!p||!p.forMe){if(modalKey==='pending')closeModal();return}let key=p.type+JSON.stringify(p.options||[])+String(p.text||'');if(modalKey===key)return;modalKey=key;let html='';if(p.type==='target')html=`<h2>${esc(p.title)}</h2><div class="choice-grid">${p.options.map(o=>`<button class="btn secondary" onclick="pendingTarget('${o.id}')">${esc(o.name)}</button>`).join('')}</div>`;else if(p.type==='chooseHidden')html=`<h2>${esc(p.title)}</h2><div class="choice-grid">${p.options.map(o=>`<button class="btn secondary" onclick="pendingHidden(${o.index})">🂠 ${o.index+1}</button>`).join('')}</div>`;else if(p.type==='choosePass'||p.type==='tradeRespond')html=`<h2>${esc(p.title)}</h2><p>下の手札から1枚選んでください。</p>`;else if(p.type==='reveal')html=`<h2>${esc(p.title)}</h2><div class="result-cards">${p.cards.map(c=>`<span class="mini-card">${CARD_NAME[c.type]}</span>`).join('')}</div><div class="actions"><button class="btn" onclick="ackPending()">確認</button></div>`;else if(p.type==='message')html=`<h2>${esc(p.title)}</h2><p>${esc(p.text)}</p><div class="actions"><button class="btn" onclick="ackPending()">確認</button></div>`;if(html)showModal(html)}
function pendingTarget(id){closeModal();act('pendingChoice',{targetId:id})}function pendingHidden(index){closeModal();act('pendingChoice',{index})}function ackPending(){closeModal();act('pendingChoice',{ack:true})}
function showHistory(){let s=me.state;showModal(`<h2>公開履歴</h2><div class="history">${s.history.map((h,i)=>`<div class="hist">${i+1}. ${esc(h)}</div>`).join('')||'まだありません'}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">閉じる</button></div>`)}
function showResult(){let r=me.state.result;if(!r)return;showModal(`<h2>リザルト</h2><p class="bigmsg">${esc(r.reason)}</p><p><b>勝者：</b>${r.winners.map(esc).join(' / ')}</p><p><b>犯人カード最終所持：</b>${esc(r.criminalHolder||'なし')}</p><h3>最終手札</h3>${r.hands.map(x=>`<div class="player-row"><b>${esc(x.name)}</b><div class="result-cards">${x.cards.map(t=>`<span class="mini-card">${CARD_NAME[t]}</span>`).join('')||'なし'}</div></div>`).join('')}<h3>犯人カード移動履歴</h3><p>${r.criminalTrail.map(esc).join(' → ')||'記録なし'}</p><div class="actions">${me.state.isHost?`<button class="btn" onclick="closeModal();act('rematch')">もう一戦</button><button class="btn secondary" onclick="closeModal();act('backLobby')">ロビーへ戻る</button>`:'<span class="muted">ホストの選択を待っています</span>'}</div>`)}
async function boot(){
  try{
    await title();
    let old={};
    try{old=JSON.parse(safeGet(localStorage,'dancingCriminalSession')||'{}')||{}}catch{safeRemove(localStorage,'dancingCriminalSession')}
    if(!(old.room&&old.token&&old.name))return;
    me={...me,...old};
    try{
      const d=await api(`/api/room/${me.room}/state?token=${encodeURIComponent(me.token)}`);
      me.state=d; render(); startPoll();
    }catch(e){
      me={room:'',token:'',name:'',state:null,selected:null};
      safeRemove(localStorage,'dancingCriminalSession');
      await title();
    }
  }catch(e){
    console.error(e);
  }
}
boot();
</script>
</body></html>
